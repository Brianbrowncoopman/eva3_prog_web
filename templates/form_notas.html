{% extends "base.html" %}

{% block title %}Notas{% endblock %}

{% block contenido %}
<div class="card_form">
    <h1>Formulario de Notas</h1>
    <form action="" method="post">
    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" name="nota1" min="10" max="70" required value="{{ nota1 }}">

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" name="nota2" min="10" max="70" required value="{{ nota2 }}">

    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" name="nota3" min="10" max="70" required value="{{ nota3 }}">

    <label for="asistencia">Asistencia (%):</label>
    <input type="number" id="asistencia" name="asistencia" min="0" max="100" required value="{{ asistencia }}">

    {% if not resultado %}
        <button type="submit" class="boton_form">Enviar</button>
    {% else %}
        <a href="/notas" class="boton_form_secundario">Reiniciar</a>
        <a href="/" class="boton_form_secundario">Ir al Home</a>
    {% endif %}
</form>
{% if resultado %}
    <div class="resultado">
        <h2>Promedio: {{ promedio }}</h2>
        <h2>Estado: {{ estado }}</h2>
    </div>
{% endif %}

</div>
{% endblock %}
